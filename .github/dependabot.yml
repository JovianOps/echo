# Dependabot: daily 06:00 WIB version updates (Renovate covers 06:00 + 18:00).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, npm]
    commit-message:
      prefix: chore
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5
